<title>말씀 낱말 탐험대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 화면 게임. 위에 달란트·소리 막대, 단계 지도, 문제 카드 → 정답 → 뜻 익히기 카드 → 가리고 떠올리기 */
:root{
  --sand:#F6EBD3; --scroll:#FFF9EC; --olive:#5E7F3A; --olive-dark:#3F5A24; --sky:#3E6FA8;
  --gold:#E8B53B; --ink:#3A2E22; --soft:#7A6A55; --line:#E3D2AE;
  --ok:#3E9B5C; --no:#D9534A; --fire:#E8792E;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;
  background-image:radial-gradient(ellipse at 15% 105%,#EAD7AE 0 140px,transparent 141px),radial-gradient(ellipse at 90% 108%,#E5CF9F 0 180px,transparent 181px);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-family:var(--display);font-size:22px;padding:14px 22px;border-radius:18px;background:var(--olive);color:#fff;box-shadow:0 5px 0 var(--olive-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--olive-dark)}
.btn.ghost{background:var(--scroll);color:var(--olive-dark);box-shadow:0 5px 0 var(--line)}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 5px 0 #b98a1c}
.btn.sm{font-size:18px;padding:10px 16px}
.hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.purse{display:flex;align-items:center;gap:6px;background:var(--scroll);border-radius:99px;padding:4px 12px 4px 5px;font-family:var(--display);font-size:19px;color:#8a5f00;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.purse.bump{animation:pop .45s}
.sp{flex:1}
.ico{background:var(--scroll);border-radius:12px;padding:6px 9px;font-family:var(--display);font-size:14px;color:var(--olive-dark);box-shadow:0 3px 0 var(--line)}
.ico.off{color:#b3a68f;text-decoration:line-through}

.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.hero h1{font-size:38px;color:var(--olive-dark)}
.hero p{color:var(--soft);line-height:1.5}
.chars{display:flex;gap:8px;justify-content:center;align-items:flex-end}
.bob{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.name-row{display:flex;gap:8px;width:100%;max-width:360px}
.name-row input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--scroll);color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:420px){.row2{grid-template-columns:1fr 1fr}.row2 .btn:first-child{grid-column:1/-1}}
.clock{background:var(--scroll);border-radius:99px;padding:5px 11px;font-family:var(--display);font-size:17px;color:var(--sky);box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.clock.low{color:#fff;background:var(--no);animation:pop 1s infinite}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bk{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 12px;border-radius:14px;background:var(--scroll);box-shadow:0 3px 0 var(--line);border:3px solid transparent;text-align:left;min-width:0}
.bk b{font-family:var(--display);font-weight:400;font-size:17px;word-break:keep-all}
.bk small{color:var(--soft);font-size:13px}
.bk.open{border-color:var(--gold)}
.bk.full{background:#DDF3E3}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.ch{font-family:var(--display);font-size:18px;padding:9px 0;border-radius:12px;background:#fff;border:2px solid var(--line)}
.ch.pick{background:var(--gold);border-color:#b98a1c;color:#4a3200;animation:pop .3s}
.ch.past{background:#D9D6CF;border-color:#B5B0A6;color:#6E6A62}
.ch.today{background:var(--sky);border-color:#2C548A;color:#fff}
.ch[disabled]{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13.5px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:16px;height:16px;padding:0;border-radius:5px}
.pindots{display:flex;gap:14px;justify-content:center}
.pindots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--olive);background:transparent}
.pindots i.on{background:var(--olive)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pk{font-family:var(--display);font-size:30px;height:66px;border-radius:18px;background:var(--scroll);box-shadow:0 4px 0 var(--line)}
.pk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.bibbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:20px;background:var(--sand);box-shadow:0 -4px 16px rgba(58,46,34,.12)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:18px;background:var(--scroll);border:3px solid var(--line);text-align:center}
.mode b{font-family:var(--display);font-weight:400;font-size:20px}
.mode small{color:var(--soft);font-size:13.5px}
.mode.on{border-color:var(--olive);background:#E7F0DC}
.mode.chal.on{border-color:var(--fire);background:#FCE7D6}
.mode[disabled]{opacity:.55;cursor:default}
.row2 .btn{font-size:19px;padding:12px 10px;display:flex;align-items:center;justify-content:center;gap:6px}

/* 단계 지도 */
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lv{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:18px;background:var(--scroll);text-align:left;box-shadow:0 4px 0 var(--line);border:3px solid transparent;min-width:0}
.lv.next{border-color:var(--gold);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--line),0 0 0 4px #E8B53B55}}
.lv .ln{font-family:var(--display);font-size:15px;color:#fff;background:var(--sky);border-radius:8px;padding:1px 8px;align-self:flex-start}
.lv.hard .ln{background:#8A4FA0}
.lv b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.3;word-break:keep-all}
.lv small{color:var(--soft);font-size:13.5px}
.lv .st{color:var(--gold);letter-spacing:1px}
.lv[disabled]{opacity:.45;cursor:default}
.bossrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:#F3E3C3;border-radius:14px;padding:8px 12px;font-family:var(--display);color:var(--olive-dark);text-align:center}
.bossrow.won{background:#FBEBB5}
.dailybtn{width:100%;animation:glow 1.6s ease-in-out infinite}
.arena{position:relative;display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(#E9F1F7,#F3E6C8);border-radius:22px;padding:12px 16px 10px;overflow:hidden}
.arena .side{display:flex;flex-direction:column;align-items:center;gap:4px}
.arena .vs{font-family:var(--display);color:var(--fire);font-size:18px;align-self:center}
.arena .hp{width:110px;height:12px;background:#E5D6B5;border-radius:99px;overflow:hidden}
.arena .hp i{display:block;height:100%;background:var(--no);transition:width .4s}
.arena small{font-family:var(--display);color:var(--soft)}
.arena .stone{position:absolute;left:70px;bottom:70px;width:14px;height:14px;border-radius:50%;background:#8d8d8d;opacity:0}
.arena.throw .stone{animation:throw .45s ease-in forwards}
@keyframes throw{0%{opacity:1;transform:translate(0,0)}60%{transform:translate(45vw,-40px)}100%{opacity:1;transform:translate(min(60vw,330px),-20px)}}
#gol.hit{display:inline-block;animation:shake .4s}
.arena.stomp{animation:shake .4s}
.slots{display:flex;justify-content:center;gap:8px;min-height:58px}
.slots span{width:52px;height:56px;border-radius:14px;border:3px dashed var(--line);background:#fff;font-family:var(--display);font-size:28px;display:flex;align-items:center;justify-content:center;color:var(--olive-dark)}
.slots span.on{border-style:solid;border-color:var(--sky)}
.slots.right span{border-color:var(--ok);background:#DDF3E3}
.slots.no{animation:shake .4s}
.slots .reveal{width:auto;padding:0 18px;border:3px solid var(--ok);background:#DDF3E3}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.tile{width:56px;height:56px;border-radius:14px;background:#FFF3D6;border:3px solid var(--gold);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-size:26px;color:var(--olive-dark)}
.tile[disabled]{opacity:.3}
.trophy{display:flex;flex-direction:column;align-items:center;gap:2px;background:#FBEBB5;border-radius:18px;padding:12px 26px;font-size:44px}
.trophy b{font-family:var(--display);font-size:20px;font-weight:400;color:var(--olive-dark)}
.trophy small{font-size:14px;color:var(--soft)}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ach{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--scroll);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line)}
.ach.on{background:#FBEBB5}
.ach .big{font-size:34px}
.ach b{font-family:var(--display);font-weight:400;font-size:17px}
.ach small{color:var(--soft);font-size:13.5px}
.stage{display:flex;align-items:center;gap:8px}
.parts{display:flex;gap:8px;overflow-x:auto}
.part{flex:1;min-width:120px;font-family:var(--display);font-size:17px;padding:10px 8px;border-radius:14px;background:var(--scroll);box-shadow:0 3px 0 var(--line);color:var(--olive-dark)}
.part.on{background:var(--olive);color:#fff;box-shadow:0 3px 0 var(--olive-dark)}
.choices.many{grid-template-columns:repeat(2,1fr)}
.choices.many .choice{font-size:19px;padding:10px 6px}
.choice.sel{border-color:var(--sky);background:#E4EEF8}
.arena.alk{background:linear-gradient(#F3E1B5,#E2C68E)}
.board{display:grid;grid-template-columns:repeat(3,26px);gap:8px;padding:12px;background:#E9C77D;border-radius:10px;border:3px solid #B98A3A;min-height:60px}
.board .bk{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#666,#111);transition:transform .45s,opacity .45s}
.board .bk.gone{transform:translate(60px,-40px) rotate(90deg);opacity:0}
.stage .arr{flex:none;width:48px;height:64px;border-radius:16px;background:var(--scroll);box-shadow:0 4px 0 var(--line);font-size:24px;color:var(--olive-dark)}
.stage .arr[disabled]{opacity:.3}
.lv.big{flex:1;align-items:center;text-align:center;gap:6px;padding:20px 14px;min-height:230px;justify-content:center}
.lv.big .ln{align-self:center;font-size:18px}
.lv.big .who{font-family:var(--display);font-size:16px;color:var(--soft)}
.lv.big b{font-size:28px}
.lv.big small{font-size:15px}
.lv.big .st{font-size:26px}
.lv.big[disabled] .st{font-size:16px;color:var(--soft);letter-spacing:0}
.lv.big .go{margin-top:4px;font-family:var(--display);font-size:20px;color:#fff;background:var(--olive);border-radius:14px;padding:8px 26px;box-shadow:0 4px 0 var(--olive-dark)}
.pips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.pip{width:30px;height:30px;border-radius:50%;background:var(--scroll);box-shadow:0 2px 0 var(--line);font-family:var(--display);font-size:13px;color:var(--olive-dark)}
.pip.clear{background:var(--gold);color:#fff}
.pip.lock{opacity:.4}
.pip.on{outline:3px solid var(--sky);outline-offset:1px}
.dad{align-self:center;color:var(--soft);font-size:14px;text-decoration:underline}

.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#EADCBC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width .4s}
.count{font-family:var(--display);color:var(--olive-dark);font-variant-numeric:tabular-nums}
.scene{display:flex;gap:10px;align-items:flex-end}
.scene svg{flex:none}
.bubble{position:relative;background:var(--scroll);border-radius:18px;padding:12px 14px;line-height:1.6;flex:1;min-width:0;box-shadow:0 3px 0 var(--line)}
.bubble b.who{font-family:var(--display);font-weight:400;color:var(--sky)}
.bubble::before{content:"";position:absolute;left:-8px;bottom:16px;border:8px solid transparent;border-right-color:var(--scroll);border-left:0}
.say{float:right;margin:0 0 4px 8px;background:#EFE4CB;border-radius:10px;padding:3px 9px;font-family:var(--display);font-size:14px;color:var(--olive-dark)}
.ref{display:inline-block;font-family:var(--display);font-size:14px;color:#fff;background:var(--sky);border-radius:8px;padding:2px 8px}

.card{background:var(--scroll);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--line)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qno{font-family:var(--display);color:var(--olive);font-size:18px}
.combo{font-family:var(--display);color:#fff;background:var(--fire);border-radius:99px;padding:2px 10px;font-size:15px}
.ask{color:var(--soft);font-size:16px}
.sentence{font-family:var(--display);font-size:24px;line-height:1.55;text-align:center;padding:8px 4px;word-break:keep-all}
.blank{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--gold);color:#9a6a00;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.choice{font-family:var(--display);font-size:23px;padding:15px 8px;border-radius:18px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);word-break:keep-all;line-height:1.35}
.choice.mean{font-family:var(--body);font-size:18px;text-align:left;padding:13px 14px;font-weight:700}
.choice .n{display:inline-block;width:1.4em;color:var(--soft);font-size:17px}
.choice.ok{background:#DDF3E3;border-color:var(--ok);box-shadow:0 4px 0 var(--ok);animation:pop .4s}
.choice.no{background:#FBE2DF;border-color:var(--no);box-shadow:0 4px 0 var(--no);animation:shake .35s}
.choice[disabled]{cursor:default}
.choice .x{display:block;color:var(--no);font-size:14px;font-weight:400}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.panel{border-radius:18px;padding:14px 16px;line-height:1.6;display:flex;flex-direction:column;gap:10px}
.panel.good{background:#DDF3E3}
.panel.bad{background:#FDF0D3}
.panel.think{background:#E4EEF8}
.panel h2{font-size:23px}
.gain{font-family:var(--display);color:#8a5f00;font-size:19px}

/* 뜻 익히기 카드 */
.learn{background:var(--scroll);border:4px solid var(--gold);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;box-shadow:0 5px 0 var(--line)}
.learn .lbl{font-family:var(--display);color:#8a5f00;font-size:16px}
.learn .big{font-family:var(--display);font-size:46px;color:var(--olive-dark);line-height:1.1}
.learn .mean{font-size:21px;font-weight:700;line-height:1.5}
.learn .mean.hide{filter:blur(9px);user-select:none}
.learn .ex{background:#fff;border-radius:12px;padding:8px 12px;width:100%}
.learn .bib{color:var(--sky);font-size:15.5px}
.learn .tip{color:var(--soft);font-size:15px}
.cmp{display:grid;gap:6px}
.cmp div{display:grid;grid-template-columns:4.6em 1fr;gap:8px;align-items:start;background:#fff;border-radius:12px;padding:8px 10px;border:2px solid transparent;text-align:left}
.cmp div.right{border-color:var(--ok)}
.cmp b{font-family:var(--display);font-weight:400;font-size:19px}
.cmp span{font-size:15.5px}

.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.big-stars{font-size:56px;color:var(--gold);letter-spacing:4px;text-shadow:0 3px 0 #b98a1c}
.big-stars span{display:inline-block;animation:pop .5s backwards}
.big-stars .off{color:#E5D6B5;text-shadow:none}
.tally{background:var(--scroll);border-radius:18px;padding:12px 18px;display:grid;grid-template-columns:auto auto;gap:4px 18px;text-align:left;box-shadow:0 3px 0 var(--line)}
.tally span:nth-child(even){text-align:right;font-family:var(--display);color:#8a5f00;font-variant-numeric:tabular-nums}
.tally .sum{border-top:2px dashed var(--line);padding-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

.dict{display:grid;gap:8px}
.dgroup h3{font-size:18px;color:var(--soft);margin:8px 0 2px}
.dword{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--scroll);border-radius:16px;padding:10px 14px;text-align:left;box-shadow:0 3px 0 var(--line)}
.dword b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--olive-dark);min-width:3em}
.dword span{font-size:15px;line-height:1.45}
.dword em{font-style:normal;color:var(--gold);letter-spacing:1px;font-size:15px}
.shop{display:flex;flex-direction:column;gap:14px;align-items:center}
.stage{background:var(--scroll);border-radius:26px;padding:16px 30px;box-shadow:0 4px 0 var(--line)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
.item{background:var(--scroll);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.item.on{border-color:var(--olive)}
.item b{font-family:var(--display);font-weight:400;font-size:18px}
.item small{color:var(--soft);font-size:13.5px;text-align:center}
.item .price{font-family:var(--display);color:#8a5f00;display:flex;align-items:center;gap:4px}
.item.locked{opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-family:var(--display);z-index:60;animation:pop .3s;white-space:nowrap}
.fly{position:fixed;z-index:50;font-family:var(--display);font-size:24px;color:#8a5f00;pointer-events:none;animation:fly 1s ease-out forwards;display:flex;align-items:center;gap:4px}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hbtn{padding:0;border-radius:18px}
.hcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 12px 14px;border-radius:18px;background:var(--scroll);border:4px solid var(--cc,var(--line));box-shadow:0 5px 0 var(--line);min-height:170px;max-width:260px;margin:0 auto;width:100%}
.hcard .hn{position:absolute;top:8px;left:10px;font-family:var(--display);font-size:14px;color:#fff;background:var(--cc,var(--soft));border-radius:8px;padding:0 7px}
.hcard b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--cc,var(--soft))}
.hcard p{font-size:15px;line-height:1.45}
.hcard small{color:var(--soft);font-size:13px}
.hcard.locked{opacity:.55;border-style:dashed}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
/* 난이도 */
.diff{display:flex;gap:3px;align-items:center}
.diff i{width:9px;height:9px;border-radius:50%;background:#E5D6B5}
.diff i.on{background:var(--fire)}
.rules{background:var(--scroll);border-radius:18px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;box-shadow:0 3px 0 var(--line);text-align:left;width:100%;margin:0}
.rules dt{font-family:var(--display);color:var(--soft)}
.rules dd{margin:0;font-family:var(--display);color:var(--ink)}
.rules dd.new{color:var(--fire)}
.hearts{font-size:20px;color:var(--no);letter-spacing:1px;white-space:nowrap}
.hearts .lost{color:#E5D6B5}
.hearts.hit{animation:shake .4s}
.timer{height:8px;background:#EADCBC;border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width 1s linear}
.timer.low i{background:var(--no)}
.tok{display:inline-block;font-family:var(--display);font-size:22px;padding:4px 8px;margin:3px 2px;border-radius:10px;background:#fff;border:2px dashed var(--line)}
.tok.found{border:2px solid var(--no);background:#FBE2DF;text-decoration:line-through}
.tok.no{animation:shake .35s;border-color:var(--no)}
.hintbox{display:grid;gap:4px;background:#FFF4D6;border-radius:12px;padding:10px 12px;font-size:15px}
.hintbtn{align-self:flex-start;background:#FFF4D6;border-radius:10px;padding:5px 10px;font-family:var(--display);font-size:15px;color:#8a5f00}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.sentence{font-size:21px}.choice{font-size:20px}.learn .big{font-size:40px}.map{grid-template-columns:1fr}}
/* 관리자 로그인(작게, 체크표 오른쪽 위) */
.adm{background:none;border:0;color:var(--soft);font-size:12px;opacity:.7;padding:4px 6px;text-decoration:underline}
.admbox{position:fixed;inset:0;background:rgba(58,46,34,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.admbox form{background:var(--scroll);border-radius:16px;padding:18px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.admbox input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}

 "먹다:겁":["겁이나 충격을 느끼다.","큰 개를 보고 겁을 먹다."],
 "쓰다:글":["종이 같은 곳에 글자를 적다.","공책에 이름을 쓰다."],
 "쓰다:머리":["모자나 안경 같은 것을 머리나 얼굴에 얹다.","모자를 쓰고 나가다."],
 "쓰다:맛":["약이나 커피처럼 혀에 느껴지는 맛이 쓰다.","약이 너무 써서 먹기 싫다."],
 "쓰다:돈":["돈이나 물건을 사용하다.","용돈을 다 써 버리다."],
 "열다:말":["('입을 열다'에서) 말을 하기 시작하다.","선생님이 입을 열자 모두 조용해졌다."],
 "열다:문":["닫힌 문이나 뚜껑을 젖히다.","창문을 열어 바람을 들이다."],
 "열다:가게":["가게 문을 열고 장사를 시작하다.","빵집은 아침 아홉 시에 문을 연다."],
 "열다:모임":["모임이나 잔치를 베풀다.","생일 잔치를 열다."],
 "귀를 기울이다":["남의 말이나 소리를 주의 깊게 듣다.","선생님 말씀에 귀를 기울이다."],
 "귀가 얇다":["남의 말을 쉽게 받아들이다.","귀가 얇아서 친구 말만 듣고 따라 했다."],
 "귀에 못이 박히다":["같은 말을 아주 여러 번 듣다.","일찍 자라는 말을 귀에 못이 박히도록 들었다."],
 "귀를 닫다":["남의 말을 들으려 하지 않다.","잔소리에 귀를 닫다."],
 "발 벗고 나서다":["남의 일이나 해야 할 일에 적극적으로 나서다.","반 청소에 발 벗고 나서다."],
 "발을 끊다":["오가던 곳에 다시 가지 않다.","그 가게에 발을 끊었다."],
 "발이 넓다":["아는 사람이 많다.","아빠는 발이 넓어서 아는 사람이 많다."],
 "발이 묶이다":["어떤 일 때문에 움직일 수 없게 되다.","폭설로 발이 묶였다."],
 "눈엣가시":["몹시 밉거나 싫어 늘 눈에 거슬리는 사람.","형은 나를 눈엣가시처럼 여겼다."],
 "눈에 넣어도 아프지 않다":["아주 귀엽다.","할머니께 손주는 눈에 넣어도 아프지 않다."],
 "눈이 높다":["좋은 것만 찾을 만큼 바라는 기준이 높다.","눈이 높아서 아무 옷이나 안 입는다."],
 "눈감아 주다":["잘못을 알고도 모른 척해 주다.","한 번만 눈감아 주세요."],
 "눈 깜짝할 사이":["아주 짧은 순간.","과자가 눈 깜짝할 사이에 없어졌다."],
 "눈코 뜰 새 없다":["정신을 차릴 수 없을 만큼 몹시 바쁘다.","이사하는 날은 눈코 뜰 새 없다."],
 "마음을 먹다":["무엇을 하겠다고 생각하다.","매일 성경을 읽기로 마음을 먹다."],
 "마음을 놓다":["걱정을 그치고 안심하다.","동생이 무사히 와서 마음을 놓았다."],
 "마음이 급하다":["빨리 하고 싶어 조급하다.","늦을까 봐 마음이 급하다."],
 "마음을 비우다":["욕심을 버리다.","마음을 비우니 편해졌다."],
 "그래서":["앞의 내용이 뒤의 내용의 까닭이 될 때 쓰는 말.","비가 왔다. 그래서 우산을 썼다."],
 "그러나":["앞의 내용과 반대되는 내용을 이을 때 쓰는 말.","배가 고팠다. 그러나 참았다."],
 "그런데":["이야기를 다른 쪽으로 돌리거나, 앞과 다른 상황을 이을 때 쓰는 말.","공원에 갔다. 그런데 문이 닫혀 있었다."],
 "또는":["둘 가운데 하나를 고를 때 쓰는 말.","빵 또는 밥을 먹자."],
 "왜냐하면":["뒤에 까닭을 말할 때 쓰는 말.","오늘은 일찍 잔다. 왜냐하면 내일 소풍을 가기 때문이다."],
 "그리고":["앞의 내용에 이어 다른 내용을 덧붙일 때 쓰는 말.","손을 씻었다. 그리고 밥을 먹었다."],
 "예를 들면":["앞의 말을 쉽게 보여 주려고 예를 들 때 쓰는 말.","과일을 좋아한다. 예를 들면 사과, 배가 있다."],
 "통곡하다":["소리를 높여 슬피 울다.","슬픈 소식에 통곡하다."],
 "환호하다":["기뻐서 크게 소리치다.","골이 들어가자 관중이 환호하다."],
 "감탄하다":["훌륭한 것을 보고 마음속 깊이 놀라다.","멋진 경치에 감탄하다."],
 "안도하다":["걱정하던 일이 해결되어 마음을 놓다.","길을 잃은 강아지를 찾고 안도하다."],
 "형통하다":["하는 일이 뜻대로 잘되어 가다.","하나님이 함께하셔서 형통하다."],
 "실패하다":["일을 잘못하여 뜻한 대로 되지 않다.","첫 번째 도전은 실패했다."],
 "게으르다":["움직이거나 일하기를 싫어하는 버릇이 있다.","게으른 베짱이."],
 "망설이다":["이리저리 생각만 하고 얼른 정하지 못하다.","말을 걸까 말까 망설이다."],
 "경외":["공경하면서 두려워함.","하나님을 경외하는 마음."],
 "의심":["확실히 알 수 없어서 믿지 못함.","친구 말을 의심하다."],
 "무시":["사람이나 말을 하찮게 여기거나 업신여김.","동생의 말을 무시하면 안 된다."],
 "원망":["못마땅하게 여겨 남을 탓함.","비가 온다고 하늘을 원망하다."],
 "원망하다":["못마땅하게 여겨 남을 탓하다.","넘어진 것을 친구 탓으로 원망하다."],
 "칭찬하다":["좋은 점이나 잘한 일을 훌륭하다고 말하다.","선생님이 나를 칭찬하셨다."],
 "위로하다":["슬프거나 괴로운 사람의 마음을 따뜻하게 달래다.","우는 친구를 위로하다."],
 "존경하다":["훌륭한 사람을 받들어 공경하다.","부모님을 존경하다."],
 "걱정":["안심이 되지 않아 마음을 졸임.","시험 걱정을 하다."],
 "꽉 차다":["빈틈없이 가득 들어차다.","상자에 장난감이 꽉 차다."],
 "텅 비다":["안에 아무것도 없다.","교실이 텅 비다."],
 "흩어지다":["한데 모여 있던 것이 여기저기로 퍼지다.","바람에 낙엽이 흩어지다."],
 "숨다":["보이지 않게 몸을 감추다.","커튼 뒤에 숨다."],
 "들어가다":["밖에서 안으로 가다.","비가 와서 집 안으로 들어가다."],
 "쉬다":["피로를 풀려고 몸을 편안히 두다.","그늘에서 잠깐 쉬다."],
 "올라가다":["낮은 곳에서 높은 곳으로 가다.","계단을 올라가다."],
 "물다:입":["입에 넣고 이로 가볍게 누르다.","강아지가 공을 입에 물고 왔다."],
 "물다:벌레":["벌레가 침으로 살을 찌르다.","모기가 팔을 물었다."],
 "물다:값":["남에게 끼친 손해를 돈으로 갚다.","깨뜨린 유리값을 물어 주었다."],
 "명하다":["윗사람이 아랫사람에게 무엇을 하라고 시키다.","왕이 신하에게 성을 지으라고 명하다."],
 "묻다":["모르는 것을 알려고 물어보다.","길을 몰라서 경찰관에게 묻다."],
 "올려다보다":["아래에서 위를 쳐다보다.","밤하늘의 별을 올려다보다."],
 "내려다보다":["위에서 아래를 보다.","산꼭대기에서 마을을 내려다보다."],
 "뒤돌아보다":["뒤쪽을 돌아다보다.","누가 부르는 소리에 뒤돌아보다."],
 "흘겨보다":["못마땅해서 눈알을 옆으로 굴려 노려보다.","동생이 나를 흘겨보다."],
 "젊다":["나이가 한창때에 있다.","우리 선생님은 젊으시다."],
 "늙다":["나이가 많이 들다.","할아버지는 늙으셨어도 건강하시다."],
 "약하다":["튼튼하지 못하다.","감기에 걸려 몸이 약해지다."],
 "착하다":["마음이 곱고 바르다.","착한 마음으로 친구를 돕다."],
 "길:여행":["어디로 가는 걸음이나 여행.","할머니 댁에 가려고 먼 길을 떠났다."],
 "길:방법":["어떤 일을 하는 방법.","숙제를 빨리 끝낼 길이 없다."],
 "길:도중":["어디로 가거나 오는 중간.","집에 오는 길에 비가 왔다."],
 "길:도로":["사람이나 차가 다니도록 만든 땅.","길이 좁아서 차가 못 지나간다."],
 "시험":["사람의 마음이 어떤지 알아보려고 떠보는 일.","하나님이 아브라함의 믿음을 시험하셨다."],
 "위로":["슬픈 마음을 따뜻하게 달래 줌.","친구에게 위로를 받다."],
 "초대":["어떤 자리에 오라고 부름.","생일 잔치에 친구를 초대하다."],
 "흉년":["곡식이 잘 자라지 않아 먹을 것이 모자란 해.","흉년이 들어 먹을 것이 없다."],
 "풍년":["곡식이 아주 잘 자라 거둘 것이 많은 해.","올해는 벼농사가 풍년이다."],
 "가뭄":["오랫동안 비가 오지 않아 메마른 날씨.","가뭄으로 논이 갈라졌다."],
 "겨울":["한 해의 네 철 가운데 가장 추운 철.","겨울에는 눈이 내린다."],
 "장마":["여름에 여러 날 계속 비가 내리는 때.","장마철에는 우산을 챙긴다."],
 "용서":["잘못을 꾸짖지 않고 덮어 줌.","잘못한 동생을 용서하다."],
 "무서워하다":["어떤 것이 겁이 나서 꺼리다.","동생은 어둠을 무서워한다."],
 "부러워하다":["남의 좋은 것을 보고 자기도 갖고 싶어 하다.","친구의 새 자전거를 부러워하다."],
 "귀찮아하다":["하기 싫고 성가시게 여기다.","청소를 귀찮아하다."],
 "아쉬워하다":["모자라거나 놓쳐서 서운해하다.","소풍이 끝나서 아쉬워하다."],
 "달콤하다":["꿀이나 사탕처럼 맛이 달다.","딸기가 달콤하다."],
 "짜다":["소금 맛이 강하다.","국이 너무 짜다."],
 "뜨겁다":["몹시 덥게 느껴질 만큼 온도가 높다.","라면 국물이 뜨겁다."],
 "딱딱하다":["몹시 굳고 단단하다.","빵이 말라서 딱딱하다."],
 "꽁무니를 빼다":["슬그머니 피하거나 물러나다.","청소 시간이 되자 꽁무니를 뺐다."],
 "잠그다":["문이나 뚜껑을 열지 못하게 걸어 두다.","나갈 때 현관문을 잠그다."],
 "지키다":["잃거나 다치지 않게 보살피다.","강아지가 집을 지키다."],
 "부수다":["단단한 것을 깨뜨려 못 쓰게 하다.","장난감을 부수다."],
 "소리:목소리":["사람이 목으로 내는 소리.","운동장에서 큰 소리로 친구를 불렀다."],
 "소리:말":["말이나 이야기.","그런 엉뚱한 소리 하지 마."],
 "소리:울림":["물건이 부딪히거나 움직여서 나는 울림.","멀리서 기차 소리가 들렸다."],
 "정탐":["몰래 사정을 살펴 알아냄.","정탐꾼이 적의 성을 살피다."],
 "청소":["더러운 것을 쓸고 닦아 깨끗하게 함.","방 청소를 하다."],
 "구경":["재미로 이것저것 둘러봄.","동물원을 구경하다."],
 "공격":["나아가서 적을 침.","적의 성을 공격하다."],
 "외모":["겉으로 보이는 모습.","외모보다 마음이 중요하다."],
 "겉모습":["겉으로 드러나 보이는 모습.","겉모습만 보고 판단하면 안 된다."],
 "마음":["사람의 생각이나 느낌이 생기는 곳.","따뜻한 마음."],
 "생각":["머리를 써서 판단하고 헤아리는 것.","좋은 생각이 떠올랐다."],
 "이름":["사람이나 물건을 부르는 말.","공책에 이름을 쓰다."],
 "막내":["형제 가운데 맨 나중에 태어난 사람.","우리 집 막내는 한 살이다."],
 "맏이":["형제 가운데 맨 먼저 태어난 사람.","맏이인 형이 동생들을 챙긴다."],
 "동생":["같은 부모에게서 나중에 태어난 사람.","동생과 함께 놀다."],
 "친구":["가깝게 오래 사귄 사람.","친구와 놀이터에서 놀다."],
 "손자":["아들이나 딸의 아들.","할머니가 손자를 안아 주신다."],
 "구하다":["위험한 데서 벗어나게 하다.","물에 빠진 아이를 구하다."],
 "살리다":["죽게 된 것을 살게 하다. 위험에서 건져 내다.","다친 새를 정성껏 살리다."],
 "버리다":["필요 없는 것을 내던지다.","쓰레기를 쓰레기통에 버리다."],
 "잡다":["손으로 쥐다. 짐승을 붙들다.","나비를 잡다."],
 "어리다":["나이가 적다.","어린 동생을 돌보다."],
 "고르다:선택":["여럿 가운데서 마음에 드는 것을 가려내다.","가게에서 과자를 골랐다."],
 "고르다:평평":["높낮이나 크기가 같고 가지런하다.","땅을 고르게 다졌다."],
 "고르다:숨":["('숨을 고르다'에서) 숨을 가다듬다.","달리기 뒤에 숨을 골랐다."],
 "슬기":["일을 바르게 판단하고 잘 처리하는 힘.","슬기를 모아 문제를 풀다."],
 "용기":["겁내지 않고 씩씩하게 나서는 힘.","용기를 내어 발표하다."],
 "건강":["몸과 마음이 아프지 않고 튼튼함.","건강을 위해 운동하다."],
 "건강하다":["몸과 마음이 아프지 않고 튼튼하다.","잘 먹고 잘 자서 건강하다."],
 "허약하다":["힘이나 기운이 없고 약하다.","몸이 허약해서 자주 아프다."],
 "밝다":["빛이 환하다. 얼굴 표정이 환하다.","아침 햇살이 밝다."],
 "크다":["길이, 넓이, 부피가 보통보다 더하다.","코끼리는 몸집이 크다."],
 "깨끗하다":["더럽지 않다.","손을 깨끗하게 씻다."],
 "발을 동동 구르다":["몹시 안타깝거나 급해서 어쩔 줄 모르다.","버스를 놓칠까 봐 발을 동동 굴렀다."],
 "발이 저리다":["발에 피가 잘 안 통해 찌릿찌릿하다.","오래 앉아 있었더니 발이 저렸다."],
 "신뢰":["굳게 믿고 의지함.","친구를 신뢰하다."],
 "찬송하다":["하나님을 높여 노래하다.","예배 시간에 하나님을 찬송하다."],
 "찬양하다":["아름답고 훌륭한 것을 크게 높여 드러내다.","하나님을 찬양하다."],

let ac=null;
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
const now=()=>{const a=ctx();return a?a.currentTime:0};
function note(f,t,dur,type="triangle",vol=.16,slide){const a=ctx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const SFX={
 tap(){note(520,now(),.07,"sine",.1)},
 flip(){note(440,now(),.1,"sine",.1,880)},
 good(){[659,784,1046].forEach((f,i)=>note(f,now()+i*.08,.18))},
 combo(n){const b=660+Math.min(n,8)*40;[b,b*1.25,b*1.5,b*2].forEach((f,i)=>note(f,now()+i*.07,.16,"square",.07))},

let bgmTimer=null,stepN=0;
function bgmStart(){if(bgmTimer||!bgmOn||!ctx())return;

const cv=document.getElementById("fx"),g2=cv.getContext("2d");let bits=[],raf=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n=60,x,y){if(reduce)return;cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#E8B53B","#5E7F3A","#D9534A","#3E6FA8","#6B4FA0","#F2A08A"];x=x??innerWidth/2;y=y??innerHeight/3;
  for(let i=0;i<n;i++)bits.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,life:90});
  if(!raf)loop()}
function loop(){g2.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.35;b.vx*=.99;b.a+=.2;b.life--;g2.save();g2.translate(b.x,b.y);g2.rotate(b.a);g2.fillStyle=b.c;g2.fillRect(-b.r/2,-b.r/4,b.r,b.r/2);g2.restore()});
  bits=bits.filter(b=>b.life>0&&b.y<cv.height+20);raf=bits.length?requestAnimationFrame(loop):(g2.clearRect(0,0,cv.width,cv.height),null)}
function flyText(html,el){if(!el)return;const r=el.getBoundingClientRect(),d=document.createElement("div");d.className="fly";d.innerHTML=html;
  d.style.left=(r.left+r.width/2-30)+"px";d.style.top=(r.top-10)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

  app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{sfx("tap");startLevel(+b.dataset.i)});
  const go=k=>{if(k<0||k>=LEVELS.length||k===mapView)return;mapView=k;sfx("flip");home()};
  on("mPrev",()=>go(mapView-1));on("mNext",()=>go(mapView+1));
  app.querySelectorAll(".pip").forEach(b=>b.onclick=()=>go(+b.dataset.k));
  const sg=document.getElementById("stage");let x0=null;
  sg.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  sg.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)go(mapView+(dx<0?1:-1))});
}

/* ================= 단계별 난이도 =================
   hearts: 목숨(0=없음) · time: 문제당 초(0=없음) · hint: "free"/달란트 값/0(없음)
   ch: 문제 보기 수 상한 · mean: 뜻 찾기 보기 수 · fix: 틀린 낱말 고치기 문제 비율
   info: 틀린 보기 뜻 알려주기 */
const DIFF0={hearts:3,time:45,hint:2,ch:4,mean:4,fix:.3,info:false};
const PRACTICE={hearts:0,time:0,hint:"free",info:true};
const getD=i=>mode==="challenge"?{...DIFF0}:{...DIFF0,...PRACTICE};
const ansW=q=>q.key||(q.w?q.w[q.a]:null); /* 그 문제에서 복습할 낱말 */
const okW=w=>w&&DICT[w]&&!w.includes(":");
const BL="(   )",isBlank=q=>q.s.includes(BL);
const ul=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<u style="text-decoration-thickness:3px;text-decoration-color:var(--gold)">$1</u>');
const plain=s=>s.replace(/\[\[|\]\]/g,"");
const filled=q=>isBlank(q)?q.s.replace(BL,q.c[q.a]):plain(q.s);
const dots=i=>`<span class="diff" aria-label="난이도 ${i+1}">${Array.from({length:10},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</span>`;

/* ================= 한 단계 진행 =================
   문제(빈칸 고르기 또는 틀린 낱말 고치기) → 정답 → 그 낱말 뜻 한 번 더 찾기 → 설명과 비교
   단계 끝: 이번 단계 낱말 + 앞 단계 낱말 다시 떠올리기 */
let play=null,tick=null;
function stopTimer(){clearInterval(tick);tick=null}
function startLevel(li,only){
  stopTimer();mapView=null;
  const L=LEVELS[li],D=getD(li);
  const items=(only||L.qs.map((_,i)=>i)).map(i=>({kind:"q",qi:i,fix:!!L.qs[i].w&&!L.qs[i].noMean&&isBlank(L.qs[i])&&Math.random()<D.fix}));
  if(!only){
    const here=[...new Set(L.qs.map(ansW))].filter(okW);
    shuffle(here).slice(0,2).forEach(w=>{const q=L.qs.find(x=>ansW(x)===w);items.push({kind:"recall",w,set:q.w||here})});
    if(li>0){const prev=LEVELS[li-1+(Math.random()<.5&&li>1?-1:0)];const pw=[...new Set(prev.qs.map(ansW))].filter(okW);const w=shuffle(pw)[0];
      if(w){const q=prev.qs.find(x=>ansW(x)===w);items.push({kind:"recall",w,set:q.w||pw,old:true})}}
  }
  play={li,L,D,items,i:0,perfect:0,combo:0,maxCombo:0,earned:0,wrong:[],retry:!!only,hearts:D.hearts,over:false,t0:Date.now()};
  if(!only)levelIntro();else step();
}
function levelIntro(){
  const L=play.L,D=play.D,n=play.li+1,prev=n>1?getD(n-2):null;
  const nw=k=>prev&&prev[k]!==D[k]?"new":"";
  const msg=n===1?`${call()}, 성경 이야기 속 빈칸에 꼭 맞는 낱말을 찾아 줘. 맞히면 그 낱말 뜻도 한 번 더 찾아야 해!`
    :`${n}단계야! 아래 규칙을 잘 봐. 빨간 글씨가 이번에 더 어려워진 거야.`;
  app.innerHTML=`${hud("단계 지도")}
  <div class="result" style="gap:10px">
    <span class="ref" style="font-size:18px;padding:4px 14px;${mode==="challenge"?"background:var(--fire)":""}">${mode==="challenge"?"도전":"연습"} ${n}단계</span>${dots(play.li)}
    <h1 style="font-size:30px;color:var(--olive-dark)">${esc(L.t)}</h1>
    <p style="color:var(--soft)">${esc(L.sub)}</p>
    <dl class="rules">
      <dt>목숨</dt><dd class="${nw("hearts")}">${D.hearts?"♥".repeat(D.hearts)+` ${D.hearts}개 (틀리면 하나씩 줄어요)`:"없음 (마음껏 틀려도 돼요)"}</dd>
      <dt>시간</dt><dd class="${nw("time")}">${D.time?`문제마다 ${D.time}초`:"없음"}</dd>
      <dt>힌트</dt><dd class="${nw("hint")}">${D.hint==="free"?"공짜":D.hint?`달란트 ${D.hint}개`:"없음"}</dd>
      <dt>보기</dt><dd class="${nw("ch")} ${nw("mean")}">낱말 ${D.ch}개까지 · 뜻 ${D.mean}개</dd>
      <dt>낱말 고치기</dt><dd class="${nw("fix")}">${D.fix?`문제의 ${Math.round(D.fix*100)}%`:"없음"}</dd>
      <dt>틀렸을 때</dt><dd class="${nw("info")}">${D.info?"그 낱말 뜻을 알려 줘요":"알려 주지 않아요"}</dd>
    </dl>
  </div>
  <div class="scene"><span class="bob">${DAVID(66,wear)}</span><div class="bubble"><b class="who">다윗</b><br>${esc(msg)}</div></div>
  <button class="btn" id="go" style="align-self:center">시작!</button>`;
  bindHud(home);
  on("go",()=>{sfx("good");step()});
}
function heartsHtml(){if(!play.D.hearts)return"";return `<span class="hearts" id="hearts">${Array.from({length:play.D.hearts},(_,k)=>`<span class="${k<play.hearts?"":"lost"}">♥</span>`).join("")}</span>`}
function topBar(){const n=play.items.length;
  return `<div class="top"><span class="ref">${play.li+1}단계</span><div class="bar"><i style="width:${play.i/n*100}%"></i></div><span class="count">${play.i+1}/${n}</span>${heartsHtml()}</div>
  ${play.D.time&&play.items[play.i].kind==="q"?`<div class="timer" id="timer"><i style="width:100%"></i></div>`:""}`}
function step(){stopTimer();const it=play.items[play.i];it.kind==="q"?question(it):recall(it)}
function nextStep(){stopTimer();play.i++;play.i<play.items.length?step():levelResult()}
/* 틀리면: 목숨 하나 줄이기. 다 쓰면 끝 */
function hurt(){
  play.combo=0;
  if(!play.D.hearts)return false;
  play.hearts--;const h=document.getElementById("hearts");
  if(h){h.outerHTML=heartsHtml();document.getElementById("hearts").classList.add("hit")}
  if(play.hearts<=0){play.over=true;stopTimer();setTimeout(gameOver,700);return true}
  return false;
}
function runTimer(it){
  if(!play.D.time)return;let left=play.D.time;stopTimer();
  const bar=()=>{const t=document.getElementById("timer");if(!t)return;t.firstElementChild.style.width=(left/play.D.time*100)+"%";t.classList.toggle("low",left<=10)};
  bar();
  tick=setInterval(()=>{left--;bar();if(left===5)sfx("tap");
    if(left<=0){stopTimer();sfx("bad");toast("시간이 끝났어요!");it.first=false;if(!hurt())runTimer(it)}},1000);
}
function trimChoices(q){
  if(q.multi||q.noMean)return q.c.map((_,i)=>i); /* 책 꼴 문제는 보기를 줄이지 않는다 */
  const idx=q.c.map((_,i)=>i);
  return [q.a,...shuffle(idx.filter(i=>i!==q.a)).slice(0,play.D.ch-1)].sort((a,b)=>a-b);
}
function question(it){
  const q=play.L.qs[it.qi],D=play.D;
  it.first=true;it.memFirst=true;it.keep=it.keep||trimChoices(q);
  const keep=it.keep;
  let body;
  if(it.fix){
    if(it.wrongI==null)it.wrongI=shuffle(keep.filter(i=>i!==q.a))[0];
    const toks=q.s.replace("(   )","\u0001").split(" ");
    body=`<p class="ask"><b style="color:var(--fire)">낱말 고치기!</b> 이 문장에서 잘못 쓴 낱말을 찾아 누르세요.</p>
      <div class="sentence" id="toks">${toks.map(t=>t.includes("\u0001")
        ?`<button class="tok" data-t="1" id="blank">${esc(t.replace("\u0001",q.c[it.wrongI]))}</button>`
        :`<button class="tok" data-t="0">${esc(t)}</button>`).join(" ")}</div>
      <div id="fixArea"></div>`;
  }else{
    const long=q.c.some(c=>plain(c).length>9),many=q.c.length>5;
    body=`<p class="ask">${esc(q.ask||"문장의 빈칸에 들어갈 가장 알맞은 말을 고르세요.")}</p>
      ${q.s?`<div class="sentence">${isBlank(q)?esc(q.s).replace(BL,'<span class="blank" id="blank">?</span>'):ul(q.s)}</div>`:""}
      ${q.multi?`<p class="ask" id="mcount" style="text-align:center">두 개를 골라요 (0/2)</p>`:""}
      <div class="choices ${long?"one":""} ${many?"many":""}" id="ch">${keep.map((i,k)=>`<button class="choice ${long?"mean":""}" data-i="${i}">${many?"":`<span class="n">${k+1}</span>`}${ul(q.c[i])}</button>`).join("")}</div>`;
  }
  app.innerHTML=`${hud("단계 지도")}${topBar()}
  <div class="scene"><span class="bob">${DAVID(62,wear)}</span><div class="bubble">
    ${q.who?`<b class="who">${esc(q.who)} 이야기</b> <span class="ref">${esc(q.ref)}</span><br>${esc(q.story)}`:`<b class="who">${esc(play.L.code||"")}</b> <span class="ref">${esc(play.L.t.replace(/^\S+\s/,""))}</span><br>${esc(play.L.sub)}`}</div></div>
  <div class="card">
    <div class="qhead"><span class="qno">${play.retry?"다시 도전":it.fix?"고치기 문제":"문제"}</span>${play.combo>=2?`<span class="combo">${play.combo}연속!</span>`:""}
      <span class="sp"></span></div>
    ${body}
    ${D.hint!==0&&q.w?`<button class="hintbtn" id="hintBtn">힌트 보기${D.hint==="free"?"":` (달란트 ${D.hint}개)`}</button><div id="hint"></div>`:""}
  </div><div id="fb"></div>`;
  bindHud(()=>{stopTimer();home()});
  on("hintBtn",()=>{
    if(D.hint!=="free"){if(talents<D.hint){sfx("bad");toast(`달란트가 ${D.hint}개 필요해요`);return}talents-=D.hint;save();document.getElementById("talN").textContent=talents}
    sfx("flip");document.getElementById("hintBtn").remove();
    document.getElementById("hint").innerHTML=`<div class="hintbox">${keep.map(i=>`<span><b>${esc(q.lab?(i+1)+"번":NAME(q.w[i]))}</b>: ${esc(M(q.w[i]))}</span>`).join("")}</div>`;
    
  });
  if(it.fix){
    app.querySelectorAll("#toks .tok").forEach(b=>b.onclick=()=>{
      if(play.over)return;
      if(b.dataset.t!=="1"){sfx("bad");b.classList.add("no");setTimeout(()=>b.classList.remove("no"),400);it.first=false;hurt();return}
      sfx("good");b.classList.add("found");app.querySelectorAll("#toks .tok").forEach(x=>x.disabled=true);
      const opts=shuffle(keep.filter(i=>i!==it.wrongI));
      document.getElementById("fixArea").innerHTML=`<p class="ask">찾았어! '${esc(q.c[it.wrongI])}' 대신 들어갈 알맞은 말은?</p>
        <div class="choices" id="ch">${opts.map((i,k)=>`<button class="choice" data-i="${i}"><span class="n">${k+1}</span>${esc(q.c[i])}</button>`).join("")}</div>`;
      
      app.querySelectorAll("#ch .choice").forEach(c=>c.onclick=()=>pick(it,q,+c.dataset.i,c));
    });
  }else if(q.multi)multiPick(it,q);
  else app.querySelectorAll("#ch .choice").forEach(b=>b.onclick=()=>pick(it,q,+b.dataset.i,b));
  runTimer(it);
}
function pick(it,q,i,btn){
  if(play.over)return;
  const fb=document.getElementById("fb");
  if(i!==q.a){
    sfx("bad");btn.classList.add("no");btn.disabled=true;it.first=false;it.miss=(it.miss||0)+1;
    if(hurt())return;
    if(q.noMean){if(it.miss>=2)reveal(it,q);else fb.innerHTML=`<div class="panel bad"><h2>아니야! 다시 골라 봐.</h2></div>`;return}
    const wd=q.w[i],nm2=q.lab?`이 문장의 '${q.lab}'`:`'${NAME(wd)}'`;
    fb.innerHTML=play.D.info
      ?`<div class="panel bad"><div class="scene">${JONATHAN(50)}<div style="flex:1;min-width:0"><h2>앗, 다시 생각해 보자!</h2>
        <p><b>${esc(nm2)}</b>는 "${esc(M(wd))}"라는 뜻이야.</p>${isBlank(q)?`<p>"${esc(q.s.replace(BL,q.c[i]))}" 이 문장, 말이 될까?</p>`:""}</div></div></div>`
      :`<div class="panel bad"><h2>아니야! 다시 골라 봐.</h2></div>`;
    
    return;
  }
  stopTimer();
  btn.classList.add("ok");app.querySelectorAll("#ch .choice").forEach(b=>b.disabled=true);
  const bl=document.getElementById("blank");if(bl){bl.textContent=q.c[q.a];bl.classList.add("pop")}
  if(it.fix){bl.classList.remove("found");bl.style.borderColor="var(--ok)";bl.style.background="#DDF3E3"}
  if(it.first){play.combo++;play.maxCombo=Math.max(play.maxCombo,play.combo);const g=((play.combo>=5?3:play.combo>=3?2:1)+(play.li>=6?1:0))*(mode==="challenge"?2:1);play.earned+=g;setTimeout(()=>addTal(g,btn),200);
    play.combo>=3?sfx("combo",play.combo):sfx("good");const r=btn.getBoundingClientRect();confetti(play.combo>=3?60:30,r.left+r.width/2,r.top)}
  else sfx("good");
  if(q.noMean)bookDone(it,q);else meanQuiz(it,q);
}
/* 책 꼴 문제: 맞히면 1초 뒤 다음 / 두 번 틀리면 정답·풀이를 보여 주고 주머니에 넣고 다음 */
function bookDone(it,q){
  const w=ansW(q);
  if(it.first){play.perfect++;if(okW(w))master(w,1)}else{play.wrong.push(it.qi);if(okW(w))bagAdd(w)}
  const pl=play;setTimeout(()=>{if(play===pl&&!play.over)nextStep()},1100);
}
function reveal(it,q){
  stopTimer();const ans=q.multi||[q.a];
  app.querySelectorAll("#ch .choice").forEach(b=>{b.disabled=true;if(ans.includes(+b.dataset.i))b.classList.add("ok")});
  const w=ansW(q);if(okW(w)){bagAdd(w);master(w,-1)}
  play.wrong.push(it.qi);play.combo=0;
  document.getElementById("fb").innerHTML=`<div class="panel think"><h2>정답은 초록색이에요</h2>${q.why?`<p>${esc(q.why)}</p>`:""}</div>`;
  const pl=play;setTimeout(()=>{if(play===pl&&!play.over)nextStep()},q.why?3200:2000);
}
/* 두 개 고르기(1-1-8) */
function multiPick(it,q){
  const sel=new Set(),cnt=document.getElementById("mcount");
  app.querySelectorAll("#ch .choice").forEach(b=>b.onclick=()=>{
    if(play.over||b.disabled)return;const i=+b.dataset.i;
    if(sel.has(i)){sel.delete(i);b.classList.remove("sel")}else{sel.add(i);b.classList.add("sel")}
    sfx("tap");cnt.textContent=`두 개를 골라요 (${sel.size}/2)`;
    if(sel.size<2)return;
    const ok=q.multi.every(k=>sel.has(k));
    if(ok){stopTimer();app.querySelectorAll("#ch .choice").forEach(x=>{x.disabled=true;x.classList.remove("sel");if(sel.has(+x.dataset.i))x.classList.add("ok")});
      if(it.first){play.combo++;play.maxCombo=Math.max(play.maxCombo,play.combo);const g=((play.combo>=5?3:play.combo>=3?2:1)+1)*(mode==="challenge"?2:1);play.earned+=g;setTimeout(()=>addTal(g,b),200);sfx("good");confetti(40)}else sfx("good");
      bookDone(it,q);return}
    sfx("bad");it.first=false;it.miss=(it.miss||0)+1;
    app.querySelectorAll("#ch .choice.sel").forEach(x=>{x.classList.remove("sel");if(!q.multi.includes(+x.dataset.i)){x.classList.add("no");x.disabled=true}});
    sel.clear();cnt.textContent="두 개를 골라요 (0/2)";
    if(hurt())return;
    if(it.miss>=2)reveal(it,q);else document.getElementById("fb").innerHTML=`<div class="panel bad"><h2>둘 다 맞아야 해요! 다시 골라 봐.</h2></div>`;
  });
}
/* 정답 → 그 낱말 뜻 한 번 더 찾기 → 설명과 비교 */
function meanQuiz(it,q){
  const w=q.w[q.a],n=play.D.mean,fb=document.getElementById("fb");
  let others=shuffle([...new Set(q.w)].filter(x=>x!==w));
  if(others.length<n-1)others=others.concat(shuffle(Object.keys(DICT).filter(x=>x!==w&&!q.w.includes(x)&&!x.includes(":"))));
  const opts=shuffle([w,...others.slice(0,n-1)]);
  const askTxt=q.lab?`밑줄 친 '${q.lab}'은(는) 이 문장에서 무슨 뜻일까?`:`'${q.c[q.a]}'(${NAME(w)})는 무슨 뜻일까?`;
  fb.innerHTML=`<div class="panel think" id="mq">
    <div class="scene">${JONATHAN(50)}<div style="flex:1;min-width:0"><h2>정답! 그런데 잠깐!</h2>
      <p><b>${esc(askTxt)}</b> 뜻까지 맞혀야 진짜 탐험대원이야.</p></div></div>
    <div class="choices one" id="mc">${opts.map(o=>`<button class="choice mean" data-w="${o}">${esc(M(o))}</button>`).join("")}</div></div>`;
  setTimeout(()=>document.getElementById("mq").scrollIntoView({behavior:"smooth",block:"start"}),150);
  
  /* 찍기 막기(2026-11-14 룡): 뜻은 한 번에 맞혀야 달란트. 두 번 틀리면 정답을 보여 주고 틀린 낱말 주머니에 넣고 넘어간다 */
  let miss=0;
  app.querySelectorAll("#mc .choice").forEach(b=>b.onclick=()=>{
    if(play.over)return;
    if(b.dataset.w!==w){
      sfx("bad");b.classList.add("no");b.disabled=true;it.memFirst=false;miss++;if(miss===1)master(w,-1);bagAdd(w);
      if(!q.lab&&q.w.includes(b.dataset.w))b.insertAdjacentHTML("beforeend",`<span class="x">이건 '${esc(NAME(b.dataset.w))}'의 뜻이에요</span>`);
      if(hurt())return;
      if(miss>=2){const ok=app.querySelector(`#mc .choice[data-w="${w}"]`);if(ok){ok.classList.add("ok");ok.insertAdjacentHTML("beforeend",`<span class="x" style="color:var(--ok)">정답은 이거예요! 주머니에 넣어 두었어요</span>`)}
        app.querySelectorAll("#mc .choice").forEach(x=>x.disabled=true);play.wrong.push(it.qi);play.combo=0;
        const pl=play;setTimeout(()=>{if(play===pl&&!play.over&&document.getElementById("mc"))nextStep()},2200)}
      return}
    b.classList.add("ok");app.querySelectorAll("#mc .choice").forEach(x=>x.disabled=true);sfx("good");
    const perfect=it.first&&it.memFirst;
    const mg=it.memFirst?2*(mode==="challenge"?2:1):0;
    if(it.memFirst){master(w,1);play.earned+=mg;addTal(mg,b)}
    if(perfect)play.perfect++;else play.wrong.push(it.qi);
    /* 딩동댕 설명 칸 없이 바로 다음 문제(2026-11-11 룡: 아이가 「다음」만 누르고 넘어감) */
    const pl=play;setTimeout(()=>{if(play===pl&&!play.over&&document.getElementById("mc"))nextStep()},1100);
  });
}
/* 단계 끝: 다시 떠올리기 (뜻만 보고 낱말 찾기) */
function recall(it){
  let opts=shuffle([...new Set(it.set)].filter(x=>x!==it.w));
  if(play.li>=7||opts.length<3)opts=opts.concat(shuffle(Object.keys(DICT).filter(x=>x!==it.w&&!it.set.includes(x)&&!x.includes(":"))));
  opts=shuffle([it.w,...opts.slice(0,Math.min(play.D.mean,5)-1)]);
  const msg=it.old?"앞 단계에서 배운 낱말이야! 기억나?":"이번 단계에서 배운 낱말이야. 뜻만 보고 찾아 봐!";
  app.innerHTML=`${hud("단계 지도")}${topBar()}
  <div class="scene">${JONATHAN(58)}<div class="bubble"><b class="who">요나단</b><br>${msg}</div></div>

/* 판마다 걸린 시간(관리자 화면에서 평균을 본다) */
function logTime(li){if(!play||play.retry)return;const t=store.get("times",[]);t.push({p:partI,li,sec:Math.round((Date.now()-play.t0)/1000),day:today()});store.set("times",t.slice(-40))}
function avgMin(){const t=store.get("times",[]).slice(-10);return t.length?(t.reduce((a,b)=>a+b.sec,0)/t.length/60).toFixed(1):null}
/* 구역 안내: 구역 3판 별 3개 개수, 열렸으면 싸우러 가기 */
function zoneLine(z){const st=zoneStages(z),n=st.filter(i=>best(i)>=3).length,b=bosses["z"+z],nm=isFinal(z)?PARTS[partI].final+" 보스":"구역 "+(z+1)+" 보스";
  return b?`🏆 ${nm}를 이겼어요 <button class="btn ghost sm" id="toBoss">다시 싸우기</button>`
   :zoneOpen(z)?`⚔️ ${nm}전이 열렸어요! <button class="btn sm" id="toBoss">싸우러 가기</button>`
   :`🔒 ${st[0]+1}~${st[st.length-1]+1}판을 모두 별 3개로 깨면 ${nm}전! (지금 ⭐⭐⭐ ${n}/${st.length}판)`}
function zonePanel(li){if(play.retry)return"";const z=zoneOf(li);return `<div class="bossrow ${bosses["z"+z]?"won":""}" style="flex-direction:column">${zoneLine(z)}</div>`}

   ${best&&st?`<span class="combo pop">최고 기록!</span>`:""}

   ${chestOK?`<button class="btn gold" id="chest">보물상자 열기</button>`:""}
   ${zoned()?zonePanel(li):!play.retry&&bossOpen(li)&&!bosses[li]?`<div class="panel" style="background:#F3E3C3;text-align:center;align-items:center"><h2 style="color:var(--fire)">⚔️ 골리앗 보스전이 열렸어요!</h2><p>별 3개를 받았어요. 낱말을 떠올려 물맷돌을 던지자!</p><button class="btn" id="toBoss">싸우러 가기</button></div>`
     :!play.retry&&st>0&&st<3&&!bosses[li]?`<p style="font-family:var(--display);color:var(--fire)">🔒 별 3개를 받으면 골리앗 보스전이 열려요!</p>`:""}
   ${chalNew?`<div class="panel" style="background:#FCE7D6;text-align:center"><h2 style="color:var(--fire)">도전 모드가 열렸어요!</h2><p>연습 10단계를 모두 깼어요. 이제 하트와 시간이 있는 도전 모드에 도전해 보세요. 달란트를 두 배로 받아요!</p></div>`:""}
   <div class="tally"><span>낱말과 뜻 모두 한 번에</span><span>${play.perfect}/${t}</span>

     <span>최고 연속</span><span>${play.maxCombo}번</span><span>받은 달란트</span><span>${play.earned}개</span>
     <span>${play.retry?"다 맞힌 보너스":"단계 보너스"}</span><span>${bonus}개</span>

   <div class="actions">
     ${play.wrong.length?`<button class="btn" id="retry">헷갈린 문제 다시 (${play.wrong.length})</button>`:""}
     ${li+1<LEVELS.length&&isOpen(li+1)?`<button class="btn ${play.wrong.length?"ghost":""}" id="nextLv">${li+2}단계로!</button>`:""}
     <button class="btn ghost" id="again">이 단계 다시</button>
     <button class="btn gold" id="toShop">${COIN(22)} 다윗 꾸미기</button>
     <button class="btn ghost" id="toMap">단계 지도</button></div></div>`;
  bindHud();
  if(!play.retry)for(let k=0;k<st;k++)setTimeout(()=>sfx("star",k),300+k*350);
  setTimeout(()=>{if(bonus){const tn=document.getElementById("totN");addTal(bonus,tn);if(tn)tn.textContent=talents+"개"}
    if(unlocked)setTimeout(()=>sfx("unlock"),400);

    const n=(2+Math.floor(Math.random()*5))*(mode==="challenge"?2:1);
    b.classList.add("pop");b.textContent="보물상자에서 달란트 "+n+"개!";sfx("buy");confetti(90);addTal(n,b);

  logTime(li);
  on("retry",()=>{sfx("tap");startLevel(li,wr)});on("nextLv",()=>{sfx("tap");startLevel(li+1)});
  on("again",()=>{sfx("tap");startLevel(li)});on("toShop",()=>{sfx("tap");shop()});on("toMap",()=>{sfx("tap");home()});

/* ================= 골리앗 보스전 · 오늘의 복습 · 업적 (2026-11-14 룡) =================
   별 3개로 단계를 깨면 그 단계 보스전이 열린다. 뜻을 보고 낱말을 떠올려 맞히면 그게 곧 물맷돌 공격.
   한 번씩은 보기 대신 글자 조각으로 낱말을 직접 만든다. 이기면 업적(트로피)이 쌓인다.
   오늘의 복습: 하루 한 번 3문제, 맞히면 작은 보물. 안 해도 벌 없음(연속 기록 없음). */
const GOLIATH=(s=110)=>`<svg width="${s}" height="${s*1.25}" viewBox="0 0 80 100" aria-label="골리앗">
<path d="M66 8v88" stroke="#7A5A3A" stroke-width="4" stroke-linecap="round"/><path d="M60 14l6-12 6 12z" fill="#A9A9A9"/>
<path d="M20 50h40l7 46H13z" fill="#8C6A4A"/><path d="M20 50h40v14H20z" fill="#B0B0B0"/><path d="M24 54h32M24 59h32" stroke="#888" stroke-width="1.5"/>
<rect x="34" y="43" width="12" height="8" fill="#C98E62"/>
<circle cx="40" cy="30" r="16" fill="#D9A273"/>
<path d="M23 28q0-20 17-20t17 20l-3-2H26z" fill="#9A9A9A" stroke="#777" stroke-width="1.5"/><path d="M40 8v14" stroke="#777" stroke-width="3"/>
<path d="M30 30l7 2M50 30l-7 2" stroke="#3A2E22" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="34" cy="33" r="2.2" fill="#3A2E22"/><circle cx="46" cy="33" r="2.2" fill="#3A2E22"/>
<path d="M26 37q14 16 28 0q0 10-14 11q-14-1-14-11z" fill="#4A2E1A"/><path d="M35 41q5-2 10 0" stroke="#F1D1B5" stroke-width="1.6" fill="none"/>
<ellipse cx="14" cy="66" rx="9" ry="13" fill="#C9A43B" stroke="#8a6f1c" stroke-width="2"/></svg>`;
const plainW=w=>!w.includes(":")&&!/\s/.test(w);
const tileOK=w=>plainW(w)&&w.length>=2&&w.length<=5;
const stageWords=i=>[...new Set(LEVELS[i].qs.map(ansW))].filter(w=>w&&plainW(w)&&DICT[w]);
const bossOpen=i=>isAdm()||(stars[i]||0)>=3||(starsC[i]||0)>=3;
const learned=()=>Object.keys(mastery).filter(w=>plainW(w)&&DICT[w]);

/* 문제 하나 그리기: 뜻 → 낱말 (보기 또는 글자 조각). done(맞음?) 을 부른다 */
function wordAsk(box,w,useTiles,done){
  const ans=NAME(w);
  if(useTiles&&tileOK(ans)){
    const others=shuffle(Object.keys(DICT).filter(x=>plainW(x)&&x!==w).join("").split("")).filter(c=>!ans.includes(c)).slice(0,2);
    const tiles=shuffle([...ans.split(""),...others]);let got=[];
    box.innerHTML=`<p class="ask">뜻을 보고 글자 조각을 눌러 낱말을 만드세요.</p>
      <div class="sentence" style="font-size:21px">"${esc(M(w))}"</div>
      <div class="slots" id="slots">${ans.split("").map(()=>`<span></span>`).join("")}</div>
      <div class="tiles">${tiles.map((c,k)=>`<button class="tile" data-k="${k}">${esc(c)}</button>`).join("")}</div>
      <button class="btn ghost sm" id="tBack" style="align-self:center">한 글자 지우기</button>`;
    const sl=[...box.querySelectorAll("#slots span")];
    const draw=()=>sl.forEach((s,k)=>{s.textContent=got[k]?tiles[got[k].k]:"";s.classList.toggle("on",!!got[k])});
    box.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(b.disabled||got.length>=ans.length)return;sfx("tap");b.disabled=true;got.push({k:+b.dataset.k,b});draw();
      if(got.length===ans.length){const made=got.map(g=>tiles[g.k]).join("");
        if(made===ans){box.querySelector("#slots").classList.add("right");box.querySelectorAll(".tile").forEach(x=>x.disabled=true);done(true)}
        else{box.querySelector("#slots").classList.add("no");setTimeout(()=>{const s=box.querySelector("#slots");if(s){s.classList.remove("no");s.innerHTML=`<span class="reveal">${esc(ans)}</span>`}},450);
          box.querySelectorAll(".tile").forEach(x=>x.disabled=true);done(false)}}});
    on("tBack",()=>{const g=got.pop();if(g){g.b.disabled=false;draw();sfx("tap")}});
  }else{
    let opts=shuffle(Object.keys(DICT).filter(x=>plainW(x)&&x!==w)).slice(0,3);
    opts=shuffle([w,...opts]);
    box.innerHTML=`<p class="ask">이 뜻을 가진 낱말을 고르세요.</p>
      <div class="sentence" style="font-size:21px">"${esc(M(w))}"</div>
      <div class="choices">${opts.map(o=>`<button class="choice" data-w="${o}">${esc(NAME(o))}</button>`).join("")}</div>`;
    box.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      box.querySelectorAll(".choice").forEach(x=>x.disabled=true);
      if(b.dataset.w===w){b.classList.add("ok");done(true)}
      else{b.classList.add("no");const ok=box.querySelector(`.choice[data-w="${w}"]`);if(ok)ok.classList.add("ok");done(false)}});
  }
}

/* 보스 설정: 숫자 = 인물 이야기 판 보스, "z0" = 책 파트 구역 보스 */
function bossCfg(id){
  if(typeof id==="string"){const z=+id.slice(1),st=zoneStages(z),fin=isFinal(z);
    const words=[].concat(...st.map(stageWords));
    return {id,key:id,hp:3+z,pool:[...new Set([...shuffle(bag).slice(0,2),...shuffle(words)])].filter(w=>DICT[w]),
      theme:fin?"alk":"gol",label:fin?PARTS[partI].final+" 보스":`구역 ${z+1} 보스`,next:st[st.length-1]+1,
      trophy:fin?`${PARTS[partI].name} ${PARTS[partI].final} 승리`:`${PARTS[partI].name} 구역 ${z+1} 보스 승리`,back:st[0]}}
  const li=id;return {id,key:li,hp:3+Math.floor(li/3),pool:[...new Set([...shuffle(bag).slice(0,2),...shuffle(stageWords(li)),...(li>0?shuffle(stageWords(li-1)).slice(0,2):[])])].filter(w=>DICT[w]),
    theme:"gol",label:`${li+1}단계 보스`,next:li+1,trophy:`${esc(LEVELS[li].hero||"")} 이야기 보스 승리`,back:li}
}
function bossFight(id){
  stopTimer();const C=bossCfg(id);mapView=C.back;
  if(C.pool.length<2){toast("이 구역 낱말이 모자라요");return}
  const B={hp:C.hp,hearts:3,n:0,over:false},alk=C.theme==="alk";
  const foe=()=>alk?`<div class="board" id="gol">${Array.from({length:C.hp},(_,k)=>`<i class="bk ${k<B.hp?"":"gone"}"></i>`).join("")}</div>`:`<span id="gol">${GOLIATH(104)}</span>`;
  const render=()=>{
    const w=C.pool[B.n%C.pool.length];
    app.innerHTML=`${hud("단계 지도")}
    <div class="arena ${alk?"alk":""}" id="arena">
      <div class="side"><span class="bob" id="dav">${DAVID(76,[...wear,"sling"])}</span><span class="hearts">${Array.from({length:3},(_,k)=>`<span class="${k<B.hearts?"":"lost"}">${alk?"⚪":"♥"}</span>`).join("")}</span></div>
      <div class="vs">${esc(C.label)}</div>
      <div class="side">${foe()}<div class="hp"><i style="width:${B.hp/C.hp*100}%"></i></div><small>${alk?"남은 검은 돌":"골리앗"} ${B.hp}/${C.hp}</small></div>
      <span class="stone" id="stone"></span>
    </div>
    <div class="card" id="bq"></div><div id="fb"></div>`;
    bindHud(home);
    wordAsk(document.getElementById("bq"),w,B.n%2===1,ok=>{
      const ar=document.getElementById("arena");
      if(ok){bagDel(w);master(w,1);sfx("flip");ar.classList.add("throw");
        setTimeout(()=>{B.hp--;sfx("good");const g=document.getElementById("gol");if(g)g.classList.add("hit");
          if(alk){const k=g&&g.querySelectorAll(".bk:not(.gone)");if(k&&k.length)k[k.length-1].classList.add("gone")}
          const bar=ar.querySelector(".hp i");if(bar)bar.style.width=(B.hp/C.hp*100)+"%";
          if(B.hp<=0){B.over=true;setTimeout(()=>bossWin(id),700)}else setTimeout(()=>{B.n++;render()},900)},450)}
      else{bagAdd(w);sfx("bad");B.hearts--;ar.classList.add("stomp");
        document.getElementById("fb").innerHTML=`<div class="panel bad"><h2>${alk?"내 흰 돌이 튕겨 나갔어요!":"골리앗이 쿵!"} 정답은 「${esc(NAME(w))}」</h2><p>${esc(M(w))}</p></div>`;
        if(B.hearts<=0){B.over=true;setTimeout(()=>bossLose(id),1800)}else setTimeout(()=>{B.n++;render()},2000)}
    });
  };
  render();
}
function bossWin(id){
  const C=bossCfg(id),first=!bosses[C.key];bosses[C.key]={day:today()};store.set(pk("bosses"),bosses);
  const prize=first?10*(mode==="challenge"?2:1):3,total=zoned()?zoneCount():LEVELS.length,alk=C.theme==="alk";
  app.innerHTML=`${hud()}
  <div class="result"><div class="chars"><span class="bob">${DAVID(84,[...wear,"sling"])}</span>${alk?"":`<span style="transform:rotate(80deg);display:inline-block;opacity:.8">${GOLIATH(70)}</span>`}</div>
   <h1 style="font-size:30px;color:var(--olive-dark)">${alk?"검은 돌을 다 쳐냈어요!":"골리앗을 무찔렀어요!"}</h1>
   ${first?`<div class="trophy pop">🏆<b>${esc(C.label)} 업적</b><small>${C.trophy}</small></div>`:`<p>다시 이겼어요! 업적은 이미 있어요.</p>`}
   <p>업적 ${Object.keys(bosses).length}/${total}</p>
   <span class="combo pop" id="prize">달란트 +${prize}</span>
   <div class="actions">${C.next<LEVELS.length&&isOpen(C.next)?`<button class="btn" id="nextLv">다음 판으로!</button>`:""}
     <button class="btn ghost" id="toAch">업적 보기</button><button class="btn ghost" id="toMap">단계 지도</button></div></div>`;
  bindHud();sfx("fanfare");confetti(160);setTimeout(()=>addTal(prize,document.getElementById("prize")),500);
  on("nextLv",()=>{sfx("tap");startLevel(C.next)});on("toAch",()=>{sfx("tap");achieve()});on("toMap",()=>{sfx("tap");mapView=null;home()});
}
function bossLose(id){
  const alk=bossCfg(id).theme==="alk";
  app.innerHTML=`${hud()}

function giftTime(reason){
  const box=document.createElement("div");box.className="admbox";document.body.appendChild(box);
  const close=()=>box.remove();box.onclick=e=>{if(e.target===box)close()};
  let typed="";
  const pin=()=>{box.innerHTML=`<form onsubmit="return false"><b style="font-family:var(--display);font-size:20px;color:var(--olive-dark)">부모님 비밀번호</b>

      <div class="pinpad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button type="button" class="pk" data-k="${k}">${k}</button>`).join("")}</div>
      <button type="button" class="btn ghost sm" id="gNo">닫기</button></form>`;
    box.querySelector("#gNo").onclick=close;
    const draw=()=>box.querySelectorAll("#gpd i").forEach((d,i)=>d.classList.toggle("on",i<typed.length));
    box.querySelectorAll(".pk").forEach(b=>b.onclick=()=>{const k=b.dataset.k;sfx("tap");
      if(k==="⌫"){typed=typed.slice(0,-1);draw();return}
      if(typed.length>=4)return;typed+=k;draw();if(typed.length<4)return;
      setTimeout(()=>{if(pinHash(typed)===pinSaved){sfx("good");pick()}else{sfx("bad");typed="";draw();box.querySelector("#gMsg").textContent="비밀번호가 달라요"}},150)})};
  const pick=()=>{box.innerHTML=`<form onsubmit="return false"><b style="font-family:var(--display);font-size:20px;color:var(--olive-dark)">상으로 줄 게임 시간</b>
      <small style="color:var(--soft)">잘한 일을 칭찬해 주세요</small>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center"><input id="gMin" type="number" inputmode="numeric" min="1" max="120" placeholder="10" style="width:7em;text-align:center;font-size:24px"><b>분</b></div>
      <p id="gErr" style="color:var(--no);min-height:1.2em;margin:0;font-size:14px"></p>
      <div class="row2"><button type="button" class="btn ghost sm" id="gNo">닫기</button><button type="button" class="btn gold sm" id="gGo">주기</button></div></form>`;
    box.querySelector("#gNo").onclick=close;const inp=box.querySelector("#gMin");inp.focus();
    const give=()=>{const m=Math.round(+inp.value);if(!(m>=1&&m<=120)){box.querySelector("#gErr").textContent="1~120 사이 숫자를 넣어 주세요";return}close();
      timeLeft+=m*60;saveTime();const g=store.get("gifts",[]);g.push({day:today(),min:m});store.set("gifts",g.slice(-60));
      sfx("fanfare");confetti(140);toast(`부모님이 상으로 게임 ${m}분을 주셨어요!`);bible(reason)};
    box.querySelector("#gGo").onclick=give;inp.onkeydown=e=>{if(e.key==="Enter")give()}};
  if(!pinSaved){pick();return}

function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

/* ================= 앱 비밀번호 =================
   처음 켤 때 부모님이 4자리를 정한다(값은 이 기기에만, 섞어서 저장).
   앱을 켤 때와, 1분 넘게 나갔다가 돌아올 때 묻는다. */
const pinHash=s=>{let h=5381;for(const ch of "mw-salt-"+s)h=((h<<5)+h+ch.charCodeAt(0))|0;return String(h>>>0)};
let pinSaved=store.get("pin",""),hiddenAt=0;
function reloadState(){
  talents=store.get("talents",0);owned=store.get("owned",[]);wear=store.get("wear",[]);mastery=store.get("mastery",{});
  cards=store.get("cards",{});mode=store.get("mode","practice");timeLeft=store.get("time",0);bag=store.get("bag",[]);
  dailyDay=store.get("daily","");readCh=store.get("bible",{});openAll=store.get("openAll",false);setPart(store.get("part",0));
  if(mode==="challenge"&&!challengeOpen())mode="practice";
}
function lockScreen(stage="enter",first=""){
  if(admin){admin=false;reloadState()}
  gated=true;admin=false;stopTimer();document.querySelectorAll(".admbox").forEach(b=>b.remove());
  let typed="";
  const title=stage==="set"?"부모님 비밀번호 정하기":stage==="again"?"한 번 더 눌러 주세요":"비밀번호를 눌러 주세요";
  const sub=stage==="set"?"앱을 켤 때마다 물어볼 숫자 4자리를 정해 주세요. 아이에게는 알려 주지 마세요.":stage==="again"?"방금 정한 4자리를 다시 눌러 주세요.":"부모님이 열어 주세요.";
  app.innerHTML=`
  <div class="result" style="gap:12px;padding-top:20px">
    <div class="chars"><span class="bob">${DAVID(80,wear)}</span>${JONATHAN(66)}</div>
    <h1 style="font-size:28px;color:var(--olive-dark)">${title}</h1>
    <p style="color:var(--soft)">${sub}</p>
    <div class="pindots" id="pd">${"<i></i>".repeat(4)}</div>
    <p id="pinMsg" style="color:var(--no);min-height:1.4em"></p>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button class="pk" data-k="${k}">${k}</button>`).join("")}</div>
  </div>`;
  const draw=()=>document.querySelectorAll("#pd i").forEach((d,i)=>d.classList.toggle("on",i<typed.length));
  app.querySelectorAll(".pk").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;sfx("tap");
    if(k==="⌫"){typed=typed.slice(0,-1);draw();return}
    if(typed.length>=4)return;typed+=k;draw();
    if(typed.length<4)return;
    setTimeout(()=>{
      if(stage==="set")return lockScreen("again",typed);
      if(stage==="again"){
        if(typed!==first){sfx("bad");return lockScreen("set")}
        pinSaved=pinHash(typed);store.set("pin",pinSaved);sfx("good");toast("비밀번호를 정했어요");return unlock();
      }
      if(pinHash(typed)===pinSaved){sfx("good");return unlock()}
      sfx("bad");typed="";draw();document.getElementById("pinMsg").textContent="비밀번호가 달라요";
    },150);
  });
}
function unlock(){gated=false;if(timeLeft>0)home();else bible("start")}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden")hiddenAt=Date.now();
  else if(hiddenAt&&pinSaved&&Date.now()-hiddenAt>60000){hiddenAt=0;lockScreen()}
});

setPart(store.get("part",0));
pinSaved?lockScreen():lockScreen("set");
</script>
